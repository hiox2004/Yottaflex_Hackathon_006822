# Shared lint/format config for all Python in the repo (backend/ and prompts/).
line-length = 100
target-version = "py311"
src = ["backend/src"]
cache-dir = ".cache/ruff"
# The local working template is git-ignored and must never be linted or reformatted.
extend-exclude = ["_template", ".claude"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[lint.per-file-ignores]
"backend/tests/*" = ["S"]
