[project]
name = "integrity-workflow"
version = "0.1.0"
description = "Academic integrity workflow backend: similarity flags, evidence, reviewer assignment, case timelines and appeals with due process."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
# tests/unit needs nothing running. tests/integration needs the database: docker compose up -d db

[tool.mypy]
python_version = "3.11"
strict = true
cache_dir = "../.cache/mypy"
files = ["src/integrity"]
