name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integrity
          POSTGRES_PASSWORD: integrity_dev
          POSTGRES_DB: integrity
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U integrity -d integrity"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://integrity:integrity_dev@localhost:5433/integrity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Type check
        working-directory: backend
        run: mypy
      - name: Tests (unit + integration)
        working-directory: backend
        run: pytest --cov=integrity --cov-report=term-missing
