[project]
name = "integrity-workflow"
version = "0.1.0"
description = "Academic integrity workflow: similarity flags, evidence, reviewer assignment, case timelines and appeals with due process."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs the Postgres container (docker compose up -d db)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]
# Only our code is linted. The local working template is git-ignored and must never be reformatted.
extend-exclude = ["starter", "tools", "kb", "research", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"
files = ["backend/integrity"]
